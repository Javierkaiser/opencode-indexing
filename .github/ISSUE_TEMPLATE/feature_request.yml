name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the problem you are trying
        to solve, not only the solution you have in mind — it usually leads to
        a better outcome.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Is your request related to a frustration? Describe it.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you would like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else — links, screenshots, related tools.
    validations:
      required: false
