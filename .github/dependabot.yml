version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # @opencode/plugin's optional peers are the @opentui packages. Bumping the
      # plugin on its own fails `npm ci` with ERESOLVE (peerOptional
      # @opentui/core >=0.5.17 while 0.5.14 is installed) and bumping @opentui on
      # its own can fail the other way, so they only work as one set.
      #
      # This group has no `dependency-type`, which is why it is listed first AND
      # why the two type-based groups below have to exclude the same patterns. A
      # `dependency-type` group claims a dependency before a pattern group ever
      # sees it, regardless of the order here — listing it first is not enough,
      # which is how #14 and #17 came out with the coupled set split apart.
      opencode-ui:
        patterns:
          - "@opencode/*"
          - "@opentui/*"
          - "solid-js"

      production-dependencies:
        dependency-type: production
        # Kept out of the group on purpose: see the note at the bottom.
        exclude-patterns:
          - "@lancedb/lancedb"
          - "apache-arrow"
          - "@opencode/*"
          - "@opentui/*"
          - "solid-js"

      dev-dependencies:
        dependency-type: development
        exclude-patterns:
          - "@opencode/*"
          - "@opentui/*"
          - "solid-js"

    ignore:
      # The types describe the oldest runtime we support (`engines.node`), not
      # the newest one available. Running ahead of the floor lets an API that
      # does not exist in Node 22 typecheck cleanly and fail in production.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

    # @lancedb/lancedb and apache-arrow stay outside every group. lancedb
    # declares `peer apache-arrow >=15.0.0 <=18.1.0`, so arrow is pinned to that
    # ceiling — and a group carrying both takes arrow to 21.x, which makes
    # `npm ci` fail before a single test runs (that is what closed #9 and #11).
    # Ungrouped, lancedb can move on its own while arrow stays at the ceiling,
    # and arrow's own PR stays visible instead of hiding inside a broken group.

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
