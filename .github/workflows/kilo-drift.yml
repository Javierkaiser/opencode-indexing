name: kilo-drift

# Weekly check that `src/registry.ts` still mirrors Kilo's embedding model
# registry. Not wired into pull requests: a network hiccup on someone's PR must
# not block it, and the check is about upstream moving, not about the diff.
#
# Exit 2 means the check could not run. It still opens/updates the issue, but the
# body says so, because an outage is not drift.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: kilo-drift
  cancel-in-progress: false

jobs:
  drift:
    name: compare the mirrored catalog with Kilo upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Compare with Kilo's registry
        id: check
        run: |
          set +e
          npm run check:kilo-mirror
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Open or update the drift issue
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Kilo registry drift"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ steps.check.outputs.exit_code }}" = "2" ]; then
            reason="The check could not fetch or parse Kilo's registry, so this run is not a drift verdict."
          else
            reason="The mirrored catalog in \`src/registry.ts\` no longer matches Kilo's registry."
          fi

          body=$(mktemp)
          {
            echo "$reason"
            echo
            echo "Run: $run_url"
            echo
            echo "Fix: copy the changed entries from"
            echo "https://github.com/Kilo-Org/kilocode/blob/main/packages/kilo-indexing/src/indexing/model-registry.ts"
            echo "into \`src/registry.ts\`, updating \`test/catalog-mirror.test.ts\` in the same change."
            echo "The workflow log has the exact provider/model diff."
          } > "$body"

          # One issue, no duplicates: exact title match, not just the search hit.
          number=$(gh issue list --state open --label dependencies \
            --search 'in:title "Kilo registry drift"' \
            --json number,title --jq 'map(select(.title == "Kilo registry drift")) | first | .number // empty')

          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$body"
          else
            gh issue create --title "$title" --label dependencies --body-file "$body"
          fi

      - name: Close the drift issue once the registries match
        if: steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          number=$(gh issue list --state open --label dependencies \
            --search 'in:title "Kilo registry drift"' \
            --json number,title --jq 'map(select(.title == "Kilo registry drift")) | first | .number // empty')

          if [ -n "$number" ]; then
            gh issue close "$number" --comment "Kilo's registry matches the mirror again as of ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          fi
