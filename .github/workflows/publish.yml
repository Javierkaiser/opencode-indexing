name: publish

# Publishes to npm, and creates the release tag and the GitHub Release when they
# are missing.
#
# Running on `main` is what makes the release automatic: bump `version` in
# package.json, push, and this workflow tags `v<version>`, publishes it, and
# creates the GitHub Release with the published tarball attached. A tag pushed by
# hand still publishes. Each piece is skipped when it already exists, so a re-run
# is a no-op — and a run can also repair a release that only got halfway.
#
# The filename is deliberate: npm's trusted publisher is configured per
# repository + workflow filename, so renaming this file breaks the OIDC exchange
# with a 404 and the publish fails.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # to push the tag and create the release
  id-token: write # required for OIDC (npm trusted publishing)

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 so `git rev-parse refs/tags/...` can see every tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether there is anything to do
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          encoded=$(node -p "encodeURIComponent(require('./package.json').name)")

          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            tagged=true
          else
            tagged=false
          fi

          # A version already on the registry cannot be published again, so this
          # is what keeps a re-run from failing.
          if curl -sf "https://registry.npmjs.org/$encoded/$version" -o /dev/null; then
            published=true
          else
            published=false
          fi

          if gh release view "v$version" >/dev/null 2>&1; then
            released=true
          else
            released=false
          fi

          echo "version:   $version"
          echo "tagged:    $tagged"
          echo "published: $published"
          echo "released:  $released"

          {
            echo "version=$version"
            echo "tagged=$tagged"
            echo "published=$published"
            echo "released=$released"
          } >> "$GITHUB_OUTPUT"

      - name: Create the tag
        if: steps.state.outputs.tagged == 'false' && steps.state.outputs.published == 'false'
        run: |
          # An annotated tag records a tagger and the runner has no git identity,
          # so `git tag -a` dies with "Committer identity unknown" (exit 128).
          # The identity is set here, in the only step that needs it.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.state.outputs.version }}" \
            -m "opencode-indexing v${{ steps.state.outputs.version }}"
          git push origin "v${{ steps.state.outputs.version }}"

      - uses: actions/setup-node@v7
        if: steps.state.outputs.published == 'false'
        with:
          # Node 24 ships npm >= 11.5.1, which is required for trusted publishing.
          # Do NOT set registry-url: setup-node would then write an .npmrc with a
          # placeholder `_authToken`, and npm would use that instead of OIDC
          # (see actions/setup-node#1551), failing with a 404 on publish.
          node-version: "24"
          package-manager-cache: false # never cache in release builds

      - name: Install
        if: steps.state.outputs.published == 'false'
        run: npm ci

      - name: Typecheck
        if: steps.state.outputs.published == 'false'
        run: npm run typecheck

      - name: Test
        if: steps.state.outputs.published == 'false'
        run: npm test

      - name: Report environment
        if: steps.state.outputs.published == 'false'
        run: |
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"
          echo "OIDC request URL set:   $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo YES || echo NO)"
          echo "OIDC request token set: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo YES || echo NO)"
          echo "NODE_AUTH_TOKEN is:     ${NODE_AUTH_TOKEN:+SET}"
          echo "NPM_CONFIG_USERCONFIG:  ${NPM_CONFIG_USERCONFIG:-unset}"

      # No token: npm detects the OIDC environment and uses trusted publishing.
      # NODE_AUTH_TOKEN has to be *absent*, not blank, or npm treats it as auth
      # config and never falls through to OIDC — hence the `env -u`.
      - name: Publish to npm
        if: steps.state.outputs.published == 'false'
        run: |
          rm -f "$HOME/.npmrc"
          if [ -n "$NPM_CONFIG_USERCONFIG" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
            echo "--- effective .npmrc ---"
            cat "$NPM_CONFIG_USERCONFIG"
          fi
          set +e
          env -u NODE_AUTH_TOKEN -u NPM_TOKEN npm publish --loglevel=verbose
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "=== npm debug log (tail) ==="
            tail -120 "$(ls -t "$HOME"/.npm/_logs/*.log | head -1)"
          fi
          exit "$rc"

      - name: Create the GitHub Release
        if: steps.state.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.state.outputs.version }}"
          name=$(node -p "require('./package.json').name")
          echo "version: $version · package: $name"

          if ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version has no tag yet — nothing to release."
            exit 0
          fi

          # Notes: the version's own CHANGELOG section, so the release page is
          # not a second copy of the history that has to be maintained by hand.
          notes=$(mktemp)
          {
            echo "**Install**"
            echo
            echo '```bash'
            echo "npm install $name"
            echo '```'
            echo
            echo "---"
            echo
            awk -v v="$version" '
              index($0, "## [" v "]") == 1 { inside = 1; next }
              inside && index($0, "## [") == 1 { exit }
              inside { print }
            ' CHANGELOG.md
            echo
            echo "---"
            echo
            echo "Full history: https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md"
          } > "$notes"
          echo "notes: $(wc -c < "$notes") bytes"

          # The artefact that was actually published, not a fresh build of it.
          # Downloaded with --retry because the registry hiccups: this used to be
          # `npm pack ... --silent`, and `--silent` hides the error while
          # `pipefail` still fails the step, so a flaky run died with exit 1 and
          # no output at all to explain it.
          url=$(npm view "$name@$version" dist.tarball)
          echo "tarball: $url"
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
            -o release-asset.tgz "$url"
          ls -l release-asset.tgz

          # Idempotent: an earlier attempt may have created it already.
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "release v$version already exists — leaving it alone."
            exit 0
          fi

          gh release create "v$version" \
            --title "v$version" \
            --notes-file "$notes" \
            "release-asset.tgz"

      - name: Summary
        run: |
          version="${{ steps.state.outputs.version }}"
          if [ "${{ steps.state.outputs.published }}" = "true" ]; then
            echo "v$version is already on npm."
          else
            echo "Published v$version to npm."
          fi
          if [ "${{ steps.state.outputs.released }}" = "true" ]; then
            echo "v$version already had a GitHub Release."
          else
            echo "Created the GitHub Release for v$version."
          fi
