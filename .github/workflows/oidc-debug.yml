name: oidc-debug

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Report versions and OIDC availability
        run: |
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL set:   $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo YES || echo NO)"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN set: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo YES || echo NO)"
          echo "GITHUB_ACTIONS: $GITHUB_ACTIONS"
